<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jasim ❤️ Aleena</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff4e8a,#ff8fb1,#ffd6e5);
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
padding:30px;
border-radius:25px;
text-align:center;
width:90%;
max-width:400px;
color:white;
animation:fade 2s;
box-shadow:0 0 25px rgba(255,255,255,.3);
}

h1{
font-size:35px;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.7;
margin-bottom:20px;
}

button{
padding:14px 30px;
border:none;
border-radius:40px;
font-size:18px;
cursor:pointer;
background:white;
color:#ff2e63;
font-weight:bold;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:absolute;
color:#fff;
font-size:22px;
animation:float 7s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-100px);
opacity:0;
}
}
</style>

</head>
<body>

<div class="card">
<h1>Jasim ❤️ Aleena</h1>

<p>

Dear Aleena,

Jab se tum meri life mein aayi ho,
har din aur bhi khoobsurat lagne laga hai.

Tum meri smile ki wajah ho,
meri duaon ka sabse pyara hissa ho.

Main perfect nahi hoon,
lekin tumhe hamesha respect,
care aur sachcha pyaar dunga.

💍

Will You Be Mine Forever?

❤️

</p>

<button onclick="love()">Yes ❤️</button>

</div>

<script>

function love(){
alert("Yay! ❤️ Thank You Aleena.\nI Love You Forever! 🥹❤️");
}

function hearts(){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*30)+"px";

heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},7000);

}

setInterval(hearts,300);

</script>

</body>
  </html>
