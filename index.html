<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Aleena ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#111,#1b1b1b,#2b2b2b);
overflow:hidden;
height:100vh;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
}

#particles{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
pointer-events:none;
overflow:hidden;
}

.welcome,
.letterPage,
#success{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:.8s;
}

.letterPage,
#success{
display:none;
}

.envelope{
font-size:90px;
animation:bounce 2s infinite;
cursor:pointer;
filter:drop-shadow(0 0 20px #ff4d6d);
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-15px);}
}

h1{
font-size:34px;
margin-top:20px;
}

p{
margin-top:10px;
font-size:18px;
color:#ddd;
text-align:center;
padding:0 20px;
}

#openBtn,
#yes,
#no{
margin-top:25px;
padding:14px 30px;
border:none;
border-radius:40px;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

#openBtn,
#yes{
background:#ff4d6d;
color:white;
box-shadow:0 0 20px rgba(255,77,109,.5);
}

#openBtn:hover,
#yes:hover{
transform:scale(1.08);
}

#no{
background:#444;
color:white;
position:relative;
}

.letter{
width:90%;
max-width:420px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.15);
padding:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(255,255,255,.1);
animation:zoom .7s;
}

@keyframes zoom{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

.letter h2{
text-align:center;
margin-bottom:20px;
color:#ff7b95;
}

#typing{
min-height:220px;
line-height:1.8;
white-space:pre-line;
font-size:17px;
color:#f5f5f5;
}

.buttons{
display:flex;
justify-content:center;
gap:15px;
margin-top:25px;
flex-wrap:wrap;
}

.bigHeart{
font-size:90px;
margin-top:25px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}

.heart{
position:absolute;
font-size:22px;
color:#ff4d6d;
animation:float 6s linear forwards;
opacity:.9;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(.5);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120px) scale(1.3);
opacity:0;
}
}

@media(max-width:480px){

.envelope{
font-size:75px;
}

h1{
font-size:28px;
}

.letter{
padding:22px;
}

#typing{
font-size:16px;
}

button{
font-size:16px;
}
}

</style>

</head>

<body>

<div id="particles"></div>

<div class="welcome">

<div class="envelope">
💌
</div>

<h1>Aleena ❤️</h1>

<p>Aapke liye ek khaas letter aaya hai...</p>

<button id="openBtn">
Open Letter 💌
</button>

</div>

<div class="letterPage">

<div class="letter">

<h2>Dear Aleena ❤️</h2>

<p id="typing"></p>

<div class="buttons">

<button id="yes">
Yes ❤️
</button>

<button id="no">
No 💔
</button>

</div>

</div>

</div>

<div id="success">

<h1>❤️ Thank You Aleena ❤️</h1>

<h2>You made Jasim the happiest person in the world 🥹❤️</h2>

<div class="bigHeart">❤️</div>

</div>

<script>

const message = `Jab se tum meri life mein aayi ho,
har din pehle se zyada khoobsurat lagne laga hai.

Tum meri smile ki wajah ho,
meri har dua ka sabse pyara hissa ho.

Main perfect nahi hoon,
lekin ek baat ka wada karta hoon...

Main hamesha tumhari respect karunga,
tumhara khayal rakhunga,
aur har khushi aur mushkil mein tumhare saath rahunga.

Aleena...

Will You Be Mine Forever? ❤️`;

const welcome = document.querySelector(".welcome");
const letterPage = document.querySelector(".letterPage");
const success = document.getElementById("success");

const typing = document.getElementById("typing");
const openBtn = document.getElementById("openBtn");
const yes = document.getElementById("yes");
const no = document.getElementById("no");

openBtn.onclick = () => {
    welcome.style.display = "none";
    letterPage.style.display = "flex";
    typeLetter();
};

let index = 0;

function typeLetter(){
    if(index < message.length){
        typing.innerHTML += message.charAt(index);
        index++;
        setTimeout(typeLetter,40);
    }
}

function createHeart(){

    const heart = document.createElement("div");

    heart.className="heart";

    heart.innerHTML=Math.random()>0.5?"❤️":"🌹";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(18+Math.random()*25)+"px";

    heart.style.animationDuration=(4+Math.random()*3)+"s";

    document.getElementById("particles").appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);

}

setInterval(createHeart,300);

yes.onclick=()=>{

letterPage.style.display="none";

success.style.display="flex";

for(let i=0;i<120;i++){

setTimeout(createHeart,i*40);

}

}

function moveButton(){

const x=Math.random()*(window.innerWidth-120);

const y=Math.random()*(window.innerHeight-80);

no.style.position="fixed";

no.style.left=x+"px";

no.style.top=y+"px";

}

no.addEventListener("mouseover",moveButton);

no.addEventListener("touchstart",moveButton);

document.body.addEventListener("click",function(e){

if(e.target!==no){

return;

}

moveButton();

});

</script>

</body>
</html>
